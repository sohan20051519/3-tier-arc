name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ============================================================================
  # Stage 1: Automated Tests & Builds (Frontend & Backend)
  # ============================================================================
  test:
    name: "[CI] Test & Build Validation"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: "[CI] Installing dependencies"
        run: |
          echo "[CI] Installing backend dependencies (npm ci)..."
          npm --prefix backend ci
          echo "[CI] Installing frontend dependencies (npm ci)..."
          npm --prefix frontend ci

      - name: "[CI] Running backend tests"
        run: |
          echo "[CI] Running backend automated tests..."
          if [ -f backend/package.json ] && grep -q '"test":' backend/package.json; then
            npm --prefix backend test
          else
            echo "[CI] Notice: Backend tests not configured in package.json"
          fi

      - name: "[CI] Building backend"
        run: |
          echo "[CI] Building backend TypeScript..."
          npm --prefix backend run build

      - name: "[CI] Building frontend"
        run: |
          echo "[CI] Building frontend React application..."
          npm --prefix frontend run build

  # ============================================================================
  # Stage 2: SonarQube Static Code Analysis & Quality Gate
  # ============================================================================
  sonarqube:
    name: "[SONAR] SonarQube Analysis & Quality Gate"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository (Full Git History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "[SONAR] Running analysis"
        uses: sonarsource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: "[SONAR] Checking Quality Gate"
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ============================================================================
  # Stage 3: Docker Build, Trivy Security Scan & Registry Push
  # ============================================================================
  build-and-scan:
    name: "[DOCKER/TRIVY/GHCR] Build, Scan & Push"
    runs-on: ubuntu-latest
    needs: sonarqube
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}
      backend_image: ${{ steps.meta.outputs.backend_image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Registry Image Tags
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          FRONTEND_IMAGE="ghcr.io/${REPO_LOWER}/taskmanager-frontend"
          BACKEND_IMAGE="ghcr.io/${REPO_LOWER}/taskmanager-backend"
          IMAGE_TAG="${{ github.sha }}"

          echo "frontend_image=${FRONTEND_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "backend_image=${BACKEND_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: "[DOCKER] Building frontend image"
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: |
            ${{ steps.meta.outputs.frontend_image }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.frontend_image }}:latest

      - name: "[DOCKER] Building backend image"
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: |
            ${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.backend_image }}:latest

      - name: "[TRIVY] Scanning frontend image"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.frontend_image }}:${{ steps.meta.outputs.image_tag }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: "[TRIVY] Scanning backend image"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.image_tag }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: "[GHCR] Pushing verified images"
        run: |
          echo "[GHCR] Pushing verified frontend image (${{ steps.meta.outputs.frontend_image }}:${{ steps.meta.outputs.image_tag }})..."
          docker push "${{ steps.meta.outputs.frontend_image }}:${{ steps.meta.outputs.image_tag }}"
          docker push "${{ steps.meta.outputs.frontend_image }}:latest"
          echo "[GHCR] Pushing verified backend image (${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.image_tag }})..."
          docker push "${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.image_tag }}"
          docker push "${{ steps.meta.outputs.backend_image }}:latest"

  # ============================================================================
  # Stage 4: Production Deployment via AWS SSM (OIDC)
  # ============================================================================
  deploy:
    name: "[DEPLOY] Deploy to Private EC2 Instances via AWS SSM"
    runs-on: ubuntu-latest
    needs: build-and-scan
    permissions:
      contents: read
      id-token: write # Required for AWS OIDC authentication
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: "[AWS] Authenticating through OIDC"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
          audience: sts.amazonaws.com

      # Deploy Backend to Backend EC2
      - name: "[DEPLOY] Deploying backend"
        env:
          BACKEND_IMAGE: ${{ needs.build-and-scan.outputs.backend_image }}:${{ needs.build-and-scan.outputs.image_tag }}
          BACKEND_INSTANCE_ID: ${{ vars.BACKEND_INSTANCE_ID }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[DEPLOY] Initiating Backend EC2 Deployment with image: $BACKEND_IMAGE"
          
          if [ -n "$BACKEND_INSTANCE_ID" ]; then
            TARGET_FLAG="--instance-ids $BACKEND_INSTANCE_ID"
          else
            TARGET_FLAG="--targets Key=tag:Role,Values=backend Key=tag:Name,Values=taskmanager-backend"
          fi

          COMMAND_ID=$(aws ssm send-command \
            $TARGET_FLAG \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Task Manager Backend" \
            --parameters "commands=[
              'set -e',
              'echo \"[1/5] Authenticating to GitHub Container Registry...\"',
              'echo \"$GHCR_TOKEN\" | docker login ghcr.io -u \"$GHCR_USER\" --password-stdin',
              'echo \"[2/5] Pulling backend image: $BACKEND_IMAGE...\"',
              'docker pull \"$BACKEND_IMAGE\"',
              'echo \"[3/5] Inspecting current backend container state for safe rollback...\"',
              'PREV_IMAGE=\$(docker inspect -f \"{{.Config.Image}}\" taskmanager-backend 2>/dev/null || echo \"\")',
              'echo \"Previous image recorded: \${PREV_IMAGE:-none}\"',
              'if [ -f /home/ssm-user/3-tier-arc/docker-compose.backend.yml ]; then cd /home/ssm-user/3-tier-arc; elif [ -f /opt/taskmanager/docker-compose.backend.yml ]; then cd /opt/taskmanager; elif [ -f /app/docker-compose.backend.yml ]; then cd /app; elif [ -f /home/ubuntu/docker-compose.backend.yml ]; then cd /home/ubuntu; elif [ -f /home/ec2-user/docker-compose.backend.yml ]; then cd /home/ec2-user; elif [ -f ./docker-compose.backend.yml ]; then cd .; else echo \"ERROR: docker-compose.backend.yml not found in /home/ssm-user/3-tier-arc or fallback directories!\" >&2; exit 1; fi',
              'echo \"[4/5] Deploying updated backend service via docker compose...\"',
              'BACKEND_IMAGE=\"$BACKEND_IMAGE\" docker compose -f docker-compose.backend.yml up -d --no-build --no-deps backend',
              'echo \"[5/5] Verifying backend health on http://localhost:5000/api/health...\"',
              'sleep 4',
              'HEALTHY=0',
              'for i in \$(seq 1 12); do',
              '  RESPONSE=\$(wget -qO- --timeout=5 http://localhost:5000/api/health 2>/dev/null || curl -s --max-time 5 http://localhost:5000/api/health 2>/dev/null || echo \"\")',
              '  echo \"Health check attempt \$i response: \$RESPONSE\"',
              '  if echo \"\$RESPONSE\" | grep -Fq \"\\\"status\\\":\\\"ok\\\"\" && echo \"\$RESPONSE\" | grep -Fq \"\\\"dbConnected\\\":true\"; then',
              '    echo \"Backend healthy and connected to PostgreSQL successfully!\"',
              '    HEALTHY=1',
              '    break',
              '  fi',
              '  sleep 5',
              'done',
              'if [ \"\$HEALTHY\" -ne 1 ]; then',
              '  echo \"ERROR: Backend health verification failed!\" >&2',
              '  if [ -n \"\$PREV_IMAGE\" ] && [ \"\$PREV_IMAGE\" != \"$BACKEND_IMAGE\" ]; then',
              '    echo \"Initiating safe rollback to previous working image: \$PREV_IMAGE...\" >&2',
              '    BACKEND_IMAGE=\"\$PREV_IMAGE\" docker compose -f docker-compose.backend.yml up -d --no-build --no-deps backend',
              '    echo \"Verifying rollback container health on http://localhost:5000/api/health...\" >&2',
              '    sleep 4',
              '    ROLLBACK_HEALTHY=0',
              '    for j in \$(seq 1 12); do',
              '      RB_RESPONSE=\$(wget -qO- --timeout=5 http://localhost:5000/api/health 2>/dev/null || curl -s --max-time 5 http://localhost:5000/api/health 2>/dev/null || echo \"\")',
              '      if echo \"\$RB_RESPONSE\" | grep -Fq \"\\\"status\\\":\\\"ok\\\"\" && echo \"\$RB_RESPONSE\" | grep -Fq \"\\\"dbConnected\\\":true\"; then',
              '        echo \"Rollback container is healthy and connected to PostgreSQL.\" >&2',
              '        ROLLBACK_HEALTHY=1',
              '        break',
              '      fi',
              '      sleep 5',
              '    done',
              '    if [ \"\$ROLLBACK_HEALTHY\" -eq 1 ]; then',
              '      echo \"Safe rollback succeeded. Previous working version restored.\" >&2',
              '    else',
              '      echo \"ERROR: Rollback container failed health check!\" >&2',
              '    fi',
              '  fi',
              '  exit 1',
              'fi',
              'echo \"Backend deployment finished successfully.\"'
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "Backend SSM Command dispatched: $COMMAND_ID"
          echo "Polling SSM execution status..."

          STATUS="Pending"
          while [ "$STATUS" = "Pending" ] || [ "$STATUS" = "InProgress" ] || [ "$STATUS" = "Delayed" ]; do
            sleep 6
            STATUS=$(aws ssm list-commands --command-id "$COMMAND_ID" --query "Commands[0].Status" --output text)
            echo "Command status: $STATUS"
          done

          if [ "$STATUS" != "Success" ]; then
            echo "Backend deployment failed with SSM status: $STATUS"
            aws ssm list-command-invocations --command-id "$COMMAND_ID" --details --query "CommandInvocations[*].CommandPlugins[*].{Output:Output,Status:Status}" --output json
            exit 1
          fi
          echo "Backend deployment completed successfully."

      # Deploy Frontend to Frontend EC2
      - name: "[DEPLOY] Deploying frontend"
        env:
          FRONTEND_IMAGE: ${{ needs.build-and-scan.outputs.frontend_image }}:${{ needs.build-and-scan.outputs.image_tag }}
          FRONTEND_INSTANCE_ID: ${{ vars.FRONTEND_INSTANCE_ID }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[DEPLOY] Initiating Frontend EC2 Deployment with image: $FRONTEND_IMAGE"

          if [ -n "$FRONTEND_INSTANCE_ID" ]; then
            TARGET_FLAG="--instance-ids $FRONTEND_INSTANCE_ID"
          else
            TARGET_FLAG="--targets Key=tag:Role,Values=frontend Key=tag:Name,Values=taskmanager-frontend"
          fi

          COMMAND_ID=$(aws ssm send-command \
            $TARGET_FLAG \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Task Manager Frontend" \
            --parameters "commands=[
              'set -e',
              'echo \"[1/5] Authenticating to GitHub Container Registry...\"',
              'echo \"$GHCR_TOKEN\" | docker login ghcr.io -u \"$GHCR_USER\" --password-stdin',
              'echo \"[2/5] Pulling frontend image: $FRONTEND_IMAGE...\"',
              'docker pull \"$FRONTEND_IMAGE\"',
              'echo \"[3/5] Inspecting current frontend container state for safe rollback...\"',
              'PREV_IMAGE=\$(docker inspect -f \"{{.Config.Image}}\" taskmanager-frontend 2>/dev/null || echo \"\")',
              'echo \"Previous frontend image recorded: \${PREV_IMAGE:-none}\"',
              'echo \"[4/5] Deploying updated frontend container...\"',
              'docker stop taskmanager-frontend 2>/dev/null || true',
              'docker rm taskmanager-frontend 2>/dev/null || true',
              'docker run -d --name taskmanager-frontend --restart unless-stopped -p 80:80 \"$FRONTEND_IMAGE\"',
              'echo \"[5/5] [HEALTH] Checking frontend web server response on port 80...\"',
              'sleep 3',
              'HEALTHY=0',
              'for i in \$(seq 1 10); do',
              '  if wget -q --spider http://localhost:80/ || curl -s -f -I http://localhost:80/ >/dev/null 2>&1; then',
              '    echo \"Frontend web server verified successfully on port 80!\"',
              '    HEALTHY=1',
              '    break',
              '  fi',
              '  sleep 3',
              'done',
              'if [ \"\$HEALTHY\" -ne 1 ]; then',
              '  echo \"ERROR: Frontend health verification failed!\" >&2',
              '  if [ -n \"\$PREV_IMAGE\" ] && [ \"\$PREV_IMAGE\" != \"$FRONTEND_IMAGE\" ]; then',
              '    echo \"Initiating safe rollback to previous frontend image: \$PREV_IMAGE...\" >&2',
              '    docker stop taskmanager-frontend 2>/dev/null || true',
              '    docker rm taskmanager-frontend 2>/dev/null || true',
              '    docker run -d --name taskmanager-frontend --restart unless-stopped -p 80:80 \"\$PREV_IMAGE\"',
              '    echo \"Rollback frontend container launched.\" >&2',
              '  fi',
              '  exit 1',
              'fi',
              'echo \"Frontend deployment finished successfully.\"'
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "Frontend SSM Command dispatched: $COMMAND_ID"
          echo "Polling SSM execution status..."

          STATUS="Pending"
          while [ "$STATUS" = "Pending" ] || [ "$STATUS" = "InProgress" ] || [ "$STATUS" = "Delayed" ]; do
            sleep 6
            STATUS=$(aws ssm list-commands --command-id "$COMMAND_ID" --query "Commands[0].Status" --output text)
            echo "Command status: $STATUS"
          done

          if [ "$STATUS" != "Success" ]; then
            echo "Frontend deployment failed with SSM status: $STATUS"
            aws ssm list-command-invocations --command-id "$COMMAND_ID" --details --query "CommandInvocations[*].CommandPlugins[*].{Output:Output,Status:Status}" --output json
            exit 1
          fi
          echo "Frontend deployment completed successfully."

      # Optional Health Verification through Public Ingress Proxy
      - name: "[HEALTH] Checking public ingress"
        if: ${{ vars.PUBLIC_NGINX_HOST != '' }}
        run: |
          echo "[HEALTH] Checking public ingress endpoint: http://${{ vars.PUBLIC_NGINX_HOST }}/api/health"
          RESPONSE=$(curl -f -s -S --connect-timeout 15 "http://${{ vars.PUBLIC_NGINX_HOST }}/api/health")
          echo "Public Ingress Health Check Response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"status":' && echo "$RESPONSE" | grep -q '"ok"'; then
            echo "[HEALTH] Public ingress check passed! Application is live and operational."
          else
            echo "ERROR: Public ingress health check returned unexpected response: $RESPONSE" >&2
            exit 1
          fi
