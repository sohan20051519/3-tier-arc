name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ============================================================================
  # Stage 1: Automated Tests & Builds (Frontend & Backend)
  # ============================================================================
  test:
    name: Test & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies (npm ci)
        run: npm --prefix backend ci

      - name: Run backend automated integration tests
        run: npm --prefix backend test

      - name: Build backend TypeScript
        run: npm --prefix backend run build

      - name: Install frontend dependencies (npm ci)
        run: npm --prefix frontend ci

      - name: Build frontend React application
        run: npm --prefix frontend run build

  # ============================================================================
  # Stage 2: SonarQube Static Code Analysis & Quality Gate
  # ============================================================================
  sonarqube:
    name: SonarQube Analysis & Quality Gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository (Full Git History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scanner
        uses: sonarsource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ============================================================================
  # Stage 3: Docker Build, Trivy Security Scan & Registry Push
  # ============================================================================
  build-and-scan:
    name: Docker Build, Trivy Scan & GHCR Push
    runs-on: ubuntu-latest
    needs: sonarqube
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}
      backend_image: ${{ steps.meta.outputs.backend_image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Registry Image Tags
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          FRONTEND_IMAGE="ghcr.io/${REPO_LOWER}/taskmanager-frontend"
          BACKEND_IMAGE="ghcr.io/${REPO_LOWER}/taskmanager-backend"
          IMAGE_TAG="${{ github.sha }}"

          echo "frontend_image=${FRONTEND_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "backend_image=${BACKEND_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build Frontend Docker Image (Local daemon)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: |
            ${{ steps.meta.outputs.frontend_image }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.frontend_image }}:latest

      - name: Build Backend Docker Image (Local daemon)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: |
            ${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.backend_image }}:latest

      - name: Trivy Vulnerability Scan (Frontend Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.frontend_image }}:${{ steps.meta.outputs.image_tag }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Trivy Vulnerability Scan (Backend Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.image_tag }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Verified Frontend Image to GHCR
        run: |
          docker push "${{ steps.meta.outputs.frontend_image }}:${{ steps.meta.outputs.image_tag }}"
          docker push "${{ steps.meta.outputs.frontend_image }}:latest"

      - name: Push Verified Backend Image to GHCR
        run: |
          docker push "${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.image_tag }}"
          docker push "${{ steps.meta.outputs.backend_image }}:latest"

  # ============================================================================
  # Stage 4: Production Deployment via AWS SSM (OIDC)
  # ============================================================================
  deploy:
    name: Deploy to Private EC2 Instances via AWS SSM
    runs-on: ubuntu-latest
    needs: build-and-scan
    permissions:
      contents: read
      id-token: write # Required for AWS OIDC authentication
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
          audience: sts.amazonaws.com

      # Deploy Backend to Backend EC2 (10.0.10.164)
      - name: Deploy Backend Tier (10.0.10.164)
        env:
          BACKEND_IMAGE: ${{ needs.build-and-scan.outputs.backend_image }}:${{ needs.build-and-scan.outputs.image_tag }}
          BACKEND_INSTANCE_ID: ${{ vars.BACKEND_INSTANCE_ID }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Initiating Backend EC2 Deployment with image: $BACKEND_IMAGE"
          
          if [ -n "$BACKEND_INSTANCE_ID" ]; then
            TARGET_FLAG="--instance-ids $BACKEND_INSTANCE_ID"
          else
            TARGET_FLAG="--targets Key=tag:Role,Values=backend Key=tag:Name,Values=taskmanager-backend"
          fi

          COMMAND_ID=$(aws ssm send-command \
            $TARGET_FLAG \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Task Manager Backend ($BACKEND_IMAGE)" \
            --parameters "commands=[
              'set -e',
              'echo \"Authenticating to GHCR...\"',
              'echo \"$GHCR_TOKEN\" | docker login ghcr.io -u \"$GHCR_USER\" --password-stdin',
              'echo \"Pulling backend image $BACKEND_IMAGE...\"',
              'docker pull \"$BACKEND_IMAGE\"',
              'echo \"Updating backend container while preserving PostgreSQL persistent volume...\"',
              'docker stop taskmanager-backend || true',
              'docker rm taskmanager-backend || true',
              'docker network create backend-db-network || true',
              'docker run -d --name taskmanager-backend --restart unless-stopped --network backend-db-network -p 5000:5000 -e PORT=5000 -e NODE_ENV=production -e DB_HOST=postgres -e DB_PORT=5432 -e DB_NAME=taskmanager_db -e DB_USER=postgres -e DB_PASSWORD=\${DB_PASSWORD:-postgres_secure_password} \"$BACKEND_IMAGE\"',
              'echo \"Verifying backend health on localhost:5000/api/health...\"',
              'sleep 5',
              'for i in {1..12}; do',
              '  HEALTH=\$(wget -qO- http://localhost:5000/api/health || curl -s http://localhost:5000/api/health || true)',
              '  echo \"Attempt \$i response: \$HEALTH\"',
              '  if echo \"\$HEALTH\" | grep -q \"status\" && echo \"\$HEALTH\" | grep -q \"ok\"; then',
              '    echo \"Backend health check verified successfully!\"',
              '    exit 0',
              '  fi',
              '  sleep 5',
              'done',
              'echo \"Backend health check failed after timeout\" >&2',
              'exit 1'
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command dispatched: $COMMAND_ID"
          echo "Polling SSM execution status..."

          STATUS="Pending"
          while [ "$STATUS" = "Pending" ] || [ "$STATUS" = "InProgress" ] || [ "$STATUS" = "Delayed" ]; do
            sleep 6
            STATUS=$(aws ssm list-commands --command-id "$COMMAND_ID" --query "Commands[0].Status" --output text)
            echo "Command status: $STATUS"
          done

          if [ "$STATUS" != "Success" ]; then
            echo "SSM Command failed with status: $STATUS"
            aws ssm list-command-invocations --command-id "$COMMAND_ID" --details --query "CommandInvocations[*].CommandPlugins[*].{Output:Output,Status:Status}" --output json
            exit 1
          fi
          echo "Backend deployment completed successfully."

      # Deploy Frontend to Frontend EC2 (10.0.10.39)
      - name: Deploy Frontend Tier (10.0.10.39)
        env:
          FRONTEND_IMAGE: ${{ needs.build-and-scan.outputs.frontend_image }}:${{ needs.build-and-scan.outputs.image_tag }}
          FRONTEND_INSTANCE_ID: ${{ vars.FRONTEND_INSTANCE_ID }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Initiating Frontend EC2 Deployment with image: $FRONTEND_IMAGE"

          if [ -n "$FRONTEND_INSTANCE_ID" ]; then
            TARGET_FLAG="--instance-ids $FRONTEND_INSTANCE_ID"
          else
            TARGET_FLAG="--targets Key=tag:Role,Values=frontend Key=tag:Name,Values=taskmanager-frontend"
          fi

          COMMAND_ID=$(aws ssm send-command \
            $TARGET_FLAG \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Task Manager Frontend ($FRONTEND_IMAGE)" \
            --parameters "commands=[
              'set -e',
              'echo \"Authenticating to GHCR...\"',
              'echo \"$GHCR_TOKEN\" | docker login ghcr.io -u \"$GHCR_USER\" --password-stdin',
              'echo \"Pulling frontend image $FRONTEND_IMAGE...\"',
              'docker pull \"$FRONTEND_IMAGE\"',
              'echo \"Deploying new frontend container...\"',
              'docker stop taskmanager-frontend || true',
              'docker rm taskmanager-frontend || true',
              'docker run -d --name taskmanager-frontend --restart unless-stopped -p 80:80 \"$FRONTEND_IMAGE\"',
              'echo \"Verifying frontend container HTTP response...\"',
              'sleep 3',
              'for i in {1..8}; do',
              '  if wget -q --spider http://localhost:80/ || curl -s -f -I http://localhost:80/ >/dev/null; then',
              '    echo \"Frontend web server running on port 80 successfully!\"',
              '    exit 0',
              '  fi',
              '  sleep 3',
              'done',
              'echo \"Frontend verification timed out\" >&2',
              'exit 1'
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command dispatched: $COMMAND_ID"
          echo "Polling SSM execution status..."

          STATUS="Pending"
          while [ "$STATUS" = "Pending" ] || [ "$STATUS" = "InProgress" ] || [ "$STATUS" = "Delayed" ]; do
            sleep 6
            STATUS=$(aws ssm list-commands --command-id "$COMMAND_ID" --query "Commands[0].Status" --output text)
            echo "Command status: $STATUS"
          done

          if [ "$STATUS" != "Success" ]; then
            echo "SSM Command failed with status: $STATUS"
            aws ssm list-command-invocations --command-id "$COMMAND_ID" --details --query "CommandInvocations[*].CommandPlugins[*].{Output:Output,Status:Status}" --output json
            exit 1
          fi
          echo "Frontend deployment completed successfully."

      # Optional Health Verification through Public Nginx Ingress
      - name: Verify Public Ingress Health
        if: ${{ vars.PUBLIC_NGINX_HOST != '' }}
        run: |
          echo "Verifying Public Ingress: http://${{ vars.PUBLIC_NGINX_HOST }}/api/health"
          curl -f -s -S --connect-timeout 10 "http://${{ vars.PUBLIC_NGINX_HOST }}/api/health" || echo "Note: Public ingress check completed"
